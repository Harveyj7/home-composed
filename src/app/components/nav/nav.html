<nav class="site-nav" aria-label="Primary navigation">
  <a
    class="site-nav__brand"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    aria-label="Home Composed Song Contest home"
  >
    <span class="site-nav__mark" aria-hidden="true">HC</span>
    <span class="site-nav__title">Home Composed</span>
  </a>

  <div class="site-nav__links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <div class="site-nav__dropdown">
      <a class="site-nav__dropdown-trigger" routerLink="/songs" routerLinkActive="active">
        All Songs
      </a>
      <div class="site-nav__dropdown-menu" aria-label="Song links">
        @for (song of songs; track song) {
          <a [routerLink]="['/songs', song]" routerLinkActive="active">Song {{ song }}</a>
        }
      </div>
    </div>
    <a routerLink="/public-vote" routerLinkActive="active">Public Vote</a>
    <a routerLink="/history" routerLinkActive="active">History</a>
    <a routerLink="/rules" routerLinkActive="active">Rules</a>
    <a routerLink="/privacy-policy" routerLinkActive="active">Privacy</a>
  </div>
</nav>
