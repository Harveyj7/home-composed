<app-nav></app-nav>

<main class="song-page">
  <a class="back-link" routerLink="/songs">Back to all songs</a>

  @if (song; as song) {
    <section class="song-detail" aria-labelledby="song-title">
      <div>
        <p class="eyebrow">Contest entry {{ song.id }}</p>
        <h1 id="song-title">{{ song.title }}</h1>
        <p>{{ song.description }}</p>
      </div>
      <img [src]="song.imageUrl" [alt]="'Artwork for ' + song.title" />
    </section>
  } @else {
    <section class="song-not-found" aria-labelledby="song-title">
      <p class="eyebrow">Song not found</p>
      <h1 id="song-title">This song does not exist</h1>
      <p>Please return to the song list and choose one of the 25 contest entries.</p>
    </section>
  }
</main>
