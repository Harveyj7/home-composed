<app-nav></app-nav>

<main class="songs-page">
  <section class="songs-hero" aria-labelledby="songs-title">
    <p class="eyebrow">All songs</p>
<!--    <h1 id="songs-title">Songs 1-25</h1>-->
    <h1 id="songs-title">Songs - To be submitted</h1>
    <p>
      Browse the competing entries for the Home Composed Song Contest 2026.
<!--      Descriptions are temporary placeholders until the final song copy is ready.-->
    </p>
  </section>

  <section class="song-list" aria-label="Song list">
    @for (song of songs; track song.id) {
      <article class="song-card">
        <img [src]="song.imageUrl" [alt]="song.title + ' stock music image'" loading="lazy" />
        <div class="song-card__content">
          <p class="song-card__number">Song {{ song.id }}</p>
          <h2>{{ song.title }}</h2>
          <p>{{ song.description }}</p>
          <a [routerLink]="['/songs', song.id]">View song</a>
        </div>
      </article>
    }
  </section>
</main>
