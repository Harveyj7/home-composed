<app-nav></app-nav>

<main class="songs-page">

  <section class="song-list" aria-label="Song list">
    <p class="eyebrow">All songs</p>
    <p>Browse the competing entries for the Home Composed Song Contest 2026.</p>
    @for (song of songs; track song.id) {
      <article class="song-card">
        <img [src]="song.imageUrl" [alt]="'Artwork for ' + song.songTitle" loading="lazy" />
        <div class="song-card__content">
          <p class="song-card__number">Song {{ song.id }}</p>
          <h2>{{ song.songTitle }}</h2>
          <p>Representing {{ song.representing }}</p>
          <a [routerLink]="['/songs', song.id]">View song</a>
        </div>
      </article>
    }
  </section>
</main>
